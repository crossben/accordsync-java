# The Accord example app. Database: SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD (HikariCP).
spring.application.name=accord-example
server.port=${ACCORD_PORT:8731}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/accord}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:accord}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:accord}
# The conformance suite sends 150 requests at once: more connections than Hikari's default 10.
spring.datasource.hikari.maximum-pool-size=20
# Accord: served at the root (/v1/push, /v1/pull, /health), migrated at startup.
accord.path-prefix=
accord.migrate-on-startup=true
# Actuator health (with the "accord" indicator) on /actuator/health.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always
# The conformance profile (contract/conformance/profile.json).
accord.example.profile=${ACCORD_PROFILE:../../contract/conformance/profile.json}
# The test-only control API (token, reset, compact, ...): off unless ACCORD_CONTROL_ENABLED=true.
accord.example.control.enabled=${ACCORD_CONTROL_ENABLED:false}
accord.example.control.port=${ACCORD_CONTROL_PORT:8732}
