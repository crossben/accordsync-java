name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * *' # daily: catches a contract change in crossben/accordsync

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: ./mvnw -B verify

  # The committed contract/ must match the Accord repository (vectors, protocol schemas, profile).
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: crossben/accordsync
          path: accord-src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: java tools/SyncContract.java --check
        env:
          ACCORD_APP_DIR: accord-src

  # The Java server against the shared server conformance suite (app/conformance, 68 tests), plus
  # the server's JUnit tests that need PostgreSQL.
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: accord
          POSTGRES_PASSWORD: accord
          POSTGRES_DB: accord
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U accord" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      ACCORD_DATABASE_URL: postgres://accord:accord@127.0.0.1:5432/accord
      ACCORD_TEST_DATABASE_URL: postgres://accord:accord@127.0.0.1:5432/accord
      ACCORD_PORT: '8701'
      ACCORD_CONTROL_PORT: '8702'
      ACCORD_APP_DIR: ${{ github.workspace }}/accord-src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: crossben/accordsync
          path: accord-src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: accord-src/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: accord-src/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: accord-src
      - name: Server tests on PostgreSQL (ledger interop with the TypeScript migrator included)
        run: ./mvnw -B -pl accordsync-server -am verify
      - name: Start the Java conformance server
        run: |
          nohup tools/conformance-server.sh > harness.log 2>&1 &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8701/health && exit 0; sleep 0.5; done
          echo "the harness did not start"; cat harness.log; exit 1
      - run: pnpm --filter @accordsync/conformance test
        working-directory: accord-src
        env:
          ACCORD_URL: http://127.0.0.1:8701
          ACCORD_CONTROL_URL: http://127.0.0.1:8702
      - if: failure()
        run: cat harness.log

  # The client fleet (interop/client-fleet): Java devices alone and next to TypeScript devices
  # (@accordsync/client from npm) through the real @accordsync/server on PostgreSQL, over a lossy network.
  client-fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: accord
          POSTGRES_PASSWORD: accord
          POSTGRES_DB: accord
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U accord" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      ACCORD_DATABASE_URL: postgres://accord:accord@127.0.0.1:5432/accord
      ACCORD_INTEROP_SEEDS: '1,2,3,4,5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: interop/client-fleet/node/package-lock.json
      - run: ./mvnw -B -q install -DskipTests
      - run: interop/client-fleet/run.sh
      - if: failure()
        run: |
          cat interop/client-fleet/server.log || true
          cat interop/client-fleet/target/surefire-reports/*.txt || true

  # The Spring Boot starter's example app (examples/spring-boot-app) against the shared server
  # conformance suite (app/conformance, 68 tests).
  spring-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: accord
          POSTGRES_PASSWORD: accord
          POSTGRES_DB: accord
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U accord" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/accord
      SPRING_DATASOURCE_USERNAME: accord
      SPRING_DATASOURCE_PASSWORD: accord
      ACCORD_PORT: '8731'
      ACCORD_CONTROL_PORT: '8732'
      ACCORD_CONTROL_ENABLED: 'true'
      ACCORD_PROFILE: ${{ github.workspace }}/contract/conformance/profile.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: crossben/accordsync
          path: accord-src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: accord-src/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: accord-src/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: accord-src
      - name: Build the starter (with its tests) and the example app
        run: |
          ./mvnw -B -pl accordsync-spring-boot-starter -am install
          ./mvnw -B -f examples/spring-boot-app/pom.xml verify
      - name: Start the example app
        run: |
          nohup java -jar examples/spring-boot-app/target/accordsync-example-spring-boot-app-0.3.0.jar > app.log 2>&1 &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8731/health && exit 0; sleep 0.5; done
          echo "the example app did not start"; cat app.log; exit 1
      - run: pnpm --filter @accordsync/conformance test
        working-directory: accord-src
        env:
          ACCORD_URL: http://127.0.0.1:8731
          ACCORD_CONTROL_URL: http://127.0.0.1:8732
      - if: failure()
        run: cat app.log

  # The mixed-server fleet (interop/server-fleet): the TypeScript reference server (accordsync
  # sources) and the Java server on one PostgreSQL at once, Java and TypeScript devices on both.
  server-fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: accord
          POSTGRES_PASSWORD: accord
          POSTGRES_DB: accord
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U accord" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      ACCORD_DATABASE_URL: postgres://accord:accord@127.0.0.1:5432/accord
      ACCORD_APP_DIR: ${{ github.workspace }}/accord-src
      ACCORD_FLEET_SEEDS: '1,2,3,4,5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: crossben/accordsync
          path: accord-src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: accord-src/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: accord-src/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: accord-src
      - run: interop/server-fleet/run.sh
      - if: failure()
        run: |
          tail -n 200 interop/server-fleet/.logs/*.log || true
          cat interop/server-fleet/target/surefire-reports/*.txt || true
