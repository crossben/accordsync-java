name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * *' # daily: catches a contract change in crossben/accordsync

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: ./mvnw -B verify

  # The committed contract/ must match the Accord repository (vectors, protocol schemas, profile).
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: crossben/accordsync
          path: accord-src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: java tools/SyncContract.java --check
        env:
          ACCORD_APP_DIR: accord-src
